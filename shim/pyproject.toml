[project]
name = "voicemode-standup"
version = "0.1.0"
description = "Multi-session wrapper around VoiceMode: agents wait for each other (conch) and each session gets its own stable voice."
requires-python = ">=3.10"
dependencies = [
    # Pinned deliberately. The shim wraps voice_mode.tools.converse's registered
    # FastMCP tool; a minor/patch bump can move internals. Bump + test together.
    "voice-mode==8.12.0",
]

[project.scripts]
voicemode-standup = "voicemode_standup.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicemode_standup"]
